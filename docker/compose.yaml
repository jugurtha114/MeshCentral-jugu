services:
  meshcentral:
    build:
      context: https://github.com/jugurtha114/MeshCentral-jugu.git#feature/audio-stream
      dockerfile: docker/Dockerfile-debian
    container_name: meshcentral
    environment:
      - DYNAMIC_CONFIG=true
      - HOSTNAME=pc.aixofit.com
      - PORT=4443
      - REDIR_PORT=80
      - ALLOW_NEW_ACCOUNTS=true
      - TRUSTED_CERT=false
    volumes:
      - ../container_data:/opt/meshcentral/meshcentral-data
      - ../container_files:/opt/meshcentral/meshcentral-files
      - ../container_web:/opt/meshcentral/meshcentral-web
      - ../container_backups:/opt/meshcentral/meshcentral-backups
    ports:
      - "4443:4443"
    restart: unless-stopped
